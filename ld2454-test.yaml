esphome:
  name: ld2454-test
  friendly_name: LD2454 Test

external_components:
  - source:
      type: git
      url: https://github.com/Sundancer78/esphome-ld2454
      ref: main
    components: [ld2454]

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:

ota:
  - platform: esphome

uart:
  id: ld2454_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 256000
  data_bits: 8
  parity: NONE
  stop_bits: 1

ld2454:
  id: radar
  uart_id: ld2454_uart

sensor:
  - platform: ld2454
    ld2454_id: radar

    target_count:
      name: "LD2454 Target Count"

    moving_target_count:
      name: "LD2454 Moving Targets"

    still_target_count:
      name: "LD2454 Still Targets"

    target_1_x:
      name: "LD2454 Target 1 X"

    target_1_y:
      name: "LD2454 Target 1 Y"

    target_1_distance:
      name: "LD2454 Target 1 Distance"

    target_1_angle:
      name: "LD2454 Target 1 Angle"

    target_1_speed:
      name: "LD2454 Target 1 Speed"

    target_1_resolution:
      name: "LD2454 Target 1 Resolution"

    target_2_x:
      name: "LD2454 Target 2 X"

    target_2_y:
      name: "LD2454 Target 2 Y"

    target_2_distance:
      name: "LD2454 Target 2 Distance"

    target_2_angle:
      name: "LD2454 Target 2 Angle"

    target_2_speed:
      name: "LD2454 Target 2 Speed"

    target_2_resolution:
      name: "LD2454 Target 2 Resolution"

    target_3_x:
      name: "LD2454 Target 3 X"

    target_3_y:
      name: "LD2454 Target 3 Y"

    target_3_distance:
      name: "LD2454 Target 3 Distance"

    target_3_angle:
      name: "LD2454 Target 3 Angle"

    target_3_speed:
      name: "LD2454 Target 3 Speed"

    target_3_resolution:
      name: "LD2454 Target 3 Resolution"

binary_sensor:
  - platform: ld2454
    ld2454_id: radar

    presence:
      name: "LD2454 Presence"

    online:
      name: "LD2454 Status"

text_sensor:
  - platform: ld2454
    ld2454_id: radar

    target_1_direction:
      name: "LD2454 Target 1 Direction"

    target_2_direction:
      name: "LD2454 Target 2 Direction"

    target_3_direction:
      name: "LD2454 Target 3 Direction"

    firmware_version:
      name: "LD2454 Firmware"

button:
  - platform: ld2454
    ld2454_id: radar

    restart:
      name: "LD2454 Restart"
      icon: mdi:power-cycle

    factory_reset:
      name: "LD2454 Factory Reset"

switch:
  - platform: ld2454
    ld2454_id: radar

    multi_target:
      name: "LD2454 Multi Target"